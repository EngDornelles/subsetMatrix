[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "subsetmatrix_rs"
description = "Native Rust/PyO3 extension backing subsetmatrix's fast numeric subset path."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Lucas Dornelles Cherobim" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/EngDornelles/subsetMatrix"
Repository = "https://github.com/EngDornelles/subsetMatrix"
Issues = "https://github.com/EngDornelles/subsetMatrix/issues"

[tool.maturin]
features = ["pyo3/extension-module"]
